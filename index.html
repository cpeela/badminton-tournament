  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 16-4-4 4-4M17 8l4 4-4 4M3 12h18"/></svg>'
};

function renderSetup() {
  const c = state.config;
  const totalPlayers = c.numGroups * c.playersPerGroup;
  const locked = isTournamentStarted();

  let html = '';

  if (locked) {
    html += `<div class="alert alert-warning">
      <div><strong>Setup Locked</strong> \u2014 ${isSuperAdmin() ? 'Tournament is in progress. Reset to make changes.' : 'Configuration is read-only while the tournament is in progress.'}</div>
    </div>`;
  }

  // ---- Configuration Card ----
  const dis = locked ? 'disabled' : '';
  html += `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Tournament Configuration</div>
          <div class="card-subtitle">Define format, scoring rules, and advancement criteria</div>
        </div>
        ${locked ? '<span class="badge badge-warning badge-dot">Locked</span>' : ''}
      </div>

      <div class="setup-section">
        <div class="card-section-title">Event</div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>Tournament Name</label>
            <input type="text" value="${c.tournamentName}" ${dis} onchange="updateConfig('tournamentName',this.value);updateHeader()">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" value="${c.date}" ${dis} onchange="updateConfig('date',this.value)">
          </div>
          <div class="form-group" style="flex:2">
            <label>Venue</label>
            <input type="text" value="${c.venue}" ${dis} onchange="updateConfig('venue',this.value)">
          </div>
        </div>
      </div>

      <div class="setup-section">
        <div class="card-section-title">Format</div>
        <div class="form-row">
          <div class="form-group">
            <label>Groups</label>
            <input type="number" inputmode="numeric" min="2" max="20" value="${c.numGroups}" ${dis} onchange="updateConfig('numGroups',+this.value)">
          </div>
          <div class="form-group">
            <label>Players / Group</label>
            <input type="number" inputmode="numeric" min="4" max="12" value="${c.playersPerGroup}" ${dis} onchange="updateConfig('playersPerGroup',+this.value)">
          </div>
          <div class="form-group">
            <label>Matches / Player</label>
            <input type="number" inputmode="numeric" min="1" max="10" value="${c.matchesPerPlayer}" ${dis} onchange="updateConfig('matchesPerPlayer',+this.value)">
          </div>
        </div>
      </div>

      <div class="setup-section">
        <div class="card-section-title">Scoring</div>
        <div class="form-row">
          <div class="form-group">
            <label>Points to Win</label>
            <input type="number" inputmode="numeric" min="11" max="30" value="${c.pointsToWin}" ${dis} onchange="updateConfig('pointsToWin',+this.value)">
          </div>
          <div class="form-group">
            <label>Deuce Cap</label>
            <input type="number" inputmode="numeric" min="${c.pointsToWin}" max="40" value="${c.deuceCap}" ${dis} onchange="updateConfig('deuceCap',+this.value)">
          </div>
        </div>
      </div>

      <div class="setup-section">
        <div class="card-section-title">Advancement</div>
        <div class="form-row">
          <div class="form-group">
            <label>Advance Top N</label>
            <input type="number" inputmode="numeric" min="1" max="${c.playersPerGroup - 1}" value="${c.advanceTop}" ${dis} onchange="updateConfig('advanceTop',+this.value)">
          </div>
          <div class="form-group">
            <label>Semi-Final Slots</label>
            <input type="number" inputmode="numeric" min="4" max="16" value="${c.semiFinalSlots}" ${dis} onchange="updateConfig('semiFinalSlots',+this.value)">
          </div>
          <div class="form-group">
            <label>Pool A Final</label>
            <select ${dis} onchange="updateConfig('championPoolFormat',this.value)">
              <option value="bestOf3" ${c.championPoolFormat === 'bestOf3' ? 'selected' : ''}>Best of 3</option>
              <option value="single" ${c.championPoolFormat === 'single' ? 'selected' : ''}>Single Game</option>
            </select>
          </div>
          <div class="form-group">
            <label>Pool B Final</label>
            <select ${dis} onchange="updateConfig('consolationPoolFormat',this.value)">
              <option value="bestOf3" ${c.consolationPoolFormat === 'bestOf3' ? 'selected' : ''}>Best of 3</option>
              <option value="single" ${c.consolationPoolFormat === 'single' ? 'selected' : ''}>Single Game</option>
            </select>
          </div>
        </div>
      </div>

      <div class="formula-strip">
        <div class="formula-item"><div class="formula-item-label">Players</div><div class="formula-item-value">${totalPlayers}</div></div>
        <div class="formula-item"><div class="formula-item-label">Pool A</div><div class="formula-item-value">${c.numGroups * c.advanceTop}</div></div>
        <div class="formula-item"><div class="formula-item-label">Pool B</div><div class="formula-item-value">${c.numGroups * (c.playersPerGroup - c.advanceTop)}</div></div>
        <div class="formula-item wide"><div class="formula-item-label">Ranking</div><div class="formula-item-value">WP <span>\u2192</span> Wins <span>\u2192</span> Points For <span>\u2192</span> Points Against</div></div>
      </div>
    </div>`;

  if (!locked && isAdmin()) {
    // ---- Add Player Card ----
    html += `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Add Players</div>
          <div class="card-subtitle">${state.players.length} of ${totalPlayers} registered</div>
        </div>
        <div class="btn-group">
          <button class="btn btn-sm admin-only" onclick="showBulkAdd()">${ICON.list}Bulk Add</button>
          <button class="btn btn-sm admin-only" onclick="document.getElementById('importFile').click()" aria-label="Import roster from Excel">${ICON.upload}Import</button>
          <button class="btn btn-sm admin-only" onclick="autoAssignGroups()">${ICON.shuffle}Auto-Assign</button>
        </div>
      </div>
      <div class="form-row" style="align-items:flex-end">
        <div class="form-group" style="flex:1">
          <label>First Name</label>
          <input type="text" id="addFirstName" placeholder="First name" autocomplete="off">
        </div>
        <div class="form-group" style="flex:1">
          <label>Last Name</label>
          <input type="text" id="addLastName" placeholder="Last name (optional)" autocomplete="off">
        </div>
        <div class="form-group" style="flex:1">
          <label>Group</label>
          <select id="addGroup">
            <option value="">\u2014 Unassigned \u2014</option>
            ${state.groups.map(g => {
              const count = g.playerIds.length;
              const full = count >= c.playersPerGroup;
              return `<option value="${g.id}" ${full ? 'disabled' : ''}>${g.name} (${count}/${c.playersPerGroup})</option>`;
            }).join('')}
          </select>
        </div>
        <div class="form-group-fixed" style="display:flex;align-items:center;min-height:40px">
          <label class="inline" style="cursor:pointer">
            <input type="checkbox" id="addLeader"> Leader
          </label>
        </div>
        <div class="form-group-fixed">
          <button class="btn btn-primary" onclick="addPlayerFromForm()">${ICON.plus}Add</button>
        </div>
      </div>
    </div>

    <!-- Players by Group -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Roster</div>
          <div class="card-subtitle">${state.players.length} / ${totalPlayers} players \u00b7 Tap a group chip to reassign \u00b7 Star sets the leader</div>
        </div>
        <span class="badge ${state.players.length >= totalPlayers ? 'badge-success' : 'badge-neutral'}">${state.players.length} / ${totalPlayers}</span>
      </div>
      ${renderPlayersByGroup()}
    </div>`;
  } else {
    html += `
    <div class="card">
      <div class="card-header">
        <div><div class="card-title">Players</div><div class="card-subtitle">${state.players.length} registered across ${state.groups.length} groups</div></div>
      </div>
      ${renderGroupSummary()}
    </div>`;
  }

  if (!locked) {
    // ---- Group Summary ----
    html += `
    <div class="card">
      <div class="card-header">
        <div><div class="card-title">Group Summary</div><div class="card-subtitle">Each group needs ${c.playersPerGroup} players and a leader</div></div>
      </div>
      ${renderGroupSummary()}
    </div>

    <div class="start-cta">
      <button class="btn btn-lg btn-primary" onclick="startTournament()" ${state.players.length < totalPlayers ? 'disabled' : ''}>
        Start Tournament \u2014 Generate QR1 Schedule
      </button>
      ${state.players.length < totalPlayers ? `<div class="helper-text">Need ${totalPlayers - state.players.length} more player${totalPlayers - state.players.length === 1 ? '' : 's'} to start</div>` : ''}
    </div>`;
  }

  document.getElementById('tab-setup').innerHTML = html;

  if (!locked) {
    const fnInput = document.getElementById('addFirstName');
    const lnInput = document.getElementById('addLastName');
    if (fnInput) {
      fnInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayerFromForm(); });
      lnInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayerFromForm(); });
    }
  }
}

function renderPlayersByGroup() {
  if (!state.players.length) return `<div class="empty-state"><div class="empty-state-icon">${ICON.users}</div><div class="empty-state-title">No players yet</div><p>Add players one at a time above, or use Bulk Add / Import to load a roster.</p></div>`;
  if (!state.groups.length) ensureGroups();

  const unassigned = state.players.filter(p => !state.groups.some(g => g.playerIds.includes(p.id)));
  let html = '';

  state.groups.forEach(g => {
    const players = g.playerIds.map(id => state.players.find(p => p.id === id)).filter(Boolean);
    if (!players.length) return;

    html += `<div class="roster-group">
      <div class="roster-group-head">
        <span class="roster-group-name">${g.name}</span>
        <span class="badge ${players.length === state.config.playersPerGroup ? 'badge-success' : 'badge-warning'}">${players.length}/${state.config.playersPerGroup}</span>
        ${g.leaderId ? '' : '<span class="badge badge-neutral">No leader</span>'}
      </div>
      <div class="table-wrap">
        <table class="roster-table">
          <thead><tr><th class="col-rank">#</th><th>Name</th><th>Group</th><th class="col-leader">Leader</th><th class="col-action"><span class="hidden">Remove</span></th></tr></thead>
          <tbody>
            ${players.map((p, i) => {
              const isLeader = g.leaderId === p.id;
              return `<tr>
                <td class="col-rank">${i + 1}</td>
                <td><input type="text" class="inline-input" value="${p.name}" aria-label="Player name" onchange="renamePlayer('${p.id}',this.value)"></td>
                <td><button type="button" class="group-chip" onclick="showGroupPicker('${p.id}')" title="Reassign group">${g.name}${ICON.swap}</button></td>
                <td class="col-leader"><button type="button" class="leader-toggle ${isLeader ? 'active' : ''}" onclick="toggleLeader('${p.id}','${g.id}')" title="${isLeader ? 'Remove as leader' : 'Set as leader'}" aria-pressed="${isLeader}" aria-label="${isLeader ? 'Remove ' + p.name + ' as leader' : 'Set ' + p.name + ' as leader'}">${ICON.star}</button></td>
                <td class="col-action"><button class="btn btn-sm btn-icon btn-ghost admin-only" onclick="removePlayer('${p.id}')" title="Remove" aria-label="Remove ${p.name}">${ICON.x}</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });

  if (unassigned.length) {
    html += `<div class="roster-group">
      <div class="roster-group-head">
        <span class="roster-group-name muted">Unassigned</span>
        <span class="badge badge-warning">${unassigned.length}</span>
      </div>
      <div class="table-wrap">
        <table class="roster-table">
          <thead><tr><th class="col-rank">#</th><th>Name</th><th>Group</th><th class="col-leader">Leader</th><th class="col-action"><span class="hidden">Remove</span></th></tr></thead>
          <tbody>
            ${unassigned.map((p, i) => `<tr>
              <td class="col-rank">${i + 1}</td>
              <td><input type="text" class="inline-input" value="${p.name}" aria-label="Player name" onchange="renamePlayer('${p.id}',this.value)"></td>
              <td><button type="button" class="group-chip unassigned" onclick="showGroupPicker('${p.id}')" title="Assign to a group">Assign${ICON.swap}</button></td>
              <td class="col-leader"></td>
              <td class="col-action"><button class="btn btn-sm btn-icon btn-ghost admin-only" onclick="removePlayer('${p.id}')" title="Remove" aria-label="Remove ${p.name}">${ICON.x}</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  return html;
}

function renderGroupSummary() {
  if (!state.groups.length) ensureGroups();
  let html = '<div class="grid-auto">';
  state.groups.forEach(g => {
    const players = g.playerIds.map(id => state.players.find(p => p.id === id)).filter(Boolean);
    const leader = g.leaderId ? state.players.find(p => p.id === g.leaderId) : null;
    html += `<div class="group-summary-card">
      <div class="group-summary-head">
        <span class="group-summary-name">${g.name}</span>
        <span class="badge ${players.length === state.config.playersPerGroup ? 'badge-success' : 'badge-warning'}">${players.length}/${state.config.playersPerGroup}</span>
      </div>
      <div class="group-summary-leader">
        <span>Leader</span>
        ${leader ? `<span class="leader-star" aria-hidden="true">\u2605</span><span class="leader-name">${leader.name}</span>` : '<span class="leader-name none">Not set</span>'}
      </div>
      <div class="players-grid">
        ${players.map(p => `<span class="player-chip ${g.leaderId === p.id ? 'is-leader' : ''}">${p.name}</span>`).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function ensureGroups() {
  const needed = state.config.numGroups;
  while (state.groups.length < needed) {
    const letter = String.fromCharCode(65 + state.groups.length);
    state.groups.push({ id: uid(), name: `Group ${letter}`, playerIds: [], court: '', leaderId: null });
  }
  while (state.groups.length > needed) state.groups.pop();
  saveState();
}

function updateConfig(key, val) {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  state.config[key] = val;
  if (key === 'numGroups') ensureGroups();
  saveState();
  renderSetup();
}

function addPlayerFromForm() {
  if (!isAdmin()) return;
  const first = document.getElementById('addFirstName').value.trim();
  const last = document.getElementById('addLastName').value.trim();
  const groupId = document.getElementById('addGroup').value;
  const isLeader = document.getElementById('addLeader').checked;

  if (!first) { toast('First name is required', 'error'); return; }
  const fullName = last ? `${first} ${last}` : first;

  if (state.players.find(p => p.name.toLowerCase() === fullName.toLowerCase())) {
    toast('Player already exists', 'error'); return;
  }

  const id = uid();
  state.players.push({ id, name: fullName });

  if (groupId) {
    const group = state.groups.find(g => g.id === groupId);
    if (group) {
      if (group.playerIds.length >= state.config.playersPerGroup) {
        toast(`${group.name} is full`, 'error');
      } else {
        group.playerIds.push(id);
        if (isLeader) group.leaderId = id;
      }
    }
  }

  saveState();
  renderSetup();
  setTimeout(() => {
    const fn = document.getElementById('addFirstName');
    if (fn) { fn.value = ''; fn.focus(); }
    const ln = document.getElementById('addLastName');
    if (ln) ln.value = '';
    const cb = document.getElementById('addLeader');
    if (cb) cb.checked = false;
  }, 50);
  toast(`Added ${fullName}`, 'success');
}

function showBulkAdd() {
  if (!isAdmin()) return;
  openModal(`
    <h2>Bulk Add Players</h2>
    <p style="font-size:.8rem;color:var(--text-secondary);margin-bottom:12px">One name per line (first last)</p>
    <textarea id="bulkNames" rows="10" placeholder="Makarand Sharma\nPuneet Singh\n..." style="font-family:var(--font-mono)"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="bulkAddPlayers()">Add All</button>
    </div>
  `);
}

function bulkAddPlayers() {
  if (!isAdmin()) return;
  const text = document.getElementById('bulkNames').value;
  const names = text.split('\n').map(s => s.trim()).filter(Boolean);
  let added = 0;
  names.forEach(name => {
    if (!state.players.find(p => p.name.toLowerCase() === name.toLowerCase())) {
      state.players.push({ id: uid(), name });
      added++;
    }
  });
  saveState();
  closeModal();
  renderSetup();
  toast(`Added ${added} players`, 'success');
}

function removePlayer(id) {
  if (!isAdmin()) return;
  state.players = state.players.filter(p => p.id !== id);
  state.groups.forEach(g => {
    g.playerIds = g.playerIds.filter(pid => pid !== id);
    if (g.leaderId === id) g.leaderId = null;
  });
  saveState();
  renderSetup();
}

function renamePlayer(id, name) {
  if (!isAdmin()) return;
  const p = state.players.find(p => p.id === id);
  if (p) p.name = name.trim();
  saveState();
}

function showGroupPicker(playerId) {
  if (!isAdmin()) return;
  const currentGroup = state.groups.find(g => g.playerIds.includes(playerId));
  const options = state.groups.map(g => {
    const count = g.playerIds.length;
    const full = count >= state.config.playersPerGroup && (!currentGroup || currentGroup.id !== g.id);
    const isCurrent = currentGroup && currentGroup.id === g.id;
    return `<button class="btn ${isCurrent ? 'btn-primary' : ''} mb-8 w-full"
      ${full ? 'disabled' : ''}
      onclick="assignPlayerToGroup('${playerId}','${g.id}')">
      ${g.name} (${count}/${state.config.playersPerGroup})${isCurrent ? ' \u2014 current' : ''}${full ? ' \u2014 full' : ''}
    </button>`;
  }).join('');

  openModal(`
    <h2>Assign ${getPlayerNameSafe(playerId)} to Group</h2>
    <div class="mt-16">${options}</div>
    <button class="btn mt-8 w-full" onclick="assignPlayerToGroup('${playerId}','')">Unassign</button>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>
  `);
}

function assignPlayerToGroup(playerId, groupId) {
  if (!isAdmin()) return;
  state.groups.forEach(g => {
    if (g.leaderId === playerId) g.leaderId = null;
    g.playerIds = g.playerIds.filter(id => id !== playerId);
  });
  if (groupId) {
    const group = state.groups.find(g => g.id === groupId);
    if (group && group.playerIds.length < state.config.playersPerGroup) {
      group.playerIds.push(playerId);
    }
  }
  saveState();
  closeModal();
  renderSetup();
}

function toggleLeader(playerId, groupId) {
  if (!isAdmin()) return;
  const group = state.groups.find(g => g.id === groupId);
  if (!group) return;
  group.leaderId = group.leaderId === playerId ? null : playerId;
  saveState();
  renderSetup();
}

function autoAssignGroups() {
  if (!isAdmin()) return;
  ensureGroups();
  state.groups.forEach(g => { g.playerIds = []; g.leaderId = null; });
  const shuffled = [...state.players].sort(() => Math.random() - .5);
  shuffled.forEach((p, i) => {
    const gi = i % state.config.numGroups;
    if (state.groups[gi].playerIds.length < state.config.playersPerGroup) {
      state.groups[gi].playerIds.push(p.id);
    }
  });
  saveState();
  renderSetup();
  toast('Players assigned randomly', 'success');
}

function startTournament() {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  const c = state.config;
  const totalNeeded = c.numGroups * c.playersPerGroup;
  if (state.players.length < totalNeeded) { toast(`Need ${totalNeeded} players`, 'error'); return; }
  const allAssigned = state.groups.every(g => g.playerIds.length === c.playersPerGroup);
  if (!allAssigned) autoAssignGroups();

  const matches = [];
  state.groups.forEach(g => {
    const schedule = generateDoublesSchedule(g.playerIds, c.matchesPerPlayer);
    schedule.forEach((m, i) => {
      matches.push({
        id: uid(), groupId: g.id, matchNum: i + 1, court: '',
        team1: { playerIds: m.team1, score: null },
        team2: { playerIds: m.team2, score: null },
        status: 'scheduled', winner: null
      });
    });
  });

  state.rounds.qr1 = { status: 'in_progress', matches, standings: [] };
  saveState();
  renderAll();
  switchTab('qr1');
  toast('QR1 schedule generated!', 'success');
}

// ═══════════════════════════════════════════════════════════════
// RENDERING — QR1 TAB
// ═══════════════════════════════════════════════════════════════

function renderQR1() {
  const qr1 = state.rounds.qr1;
  if (qr1.status === 'not_started') {
    document.getElementById('tab-qr1').innerHTML = `<div class="empty-state"><div class="empty-state-icon">${ICON.calendar}</div><div class="empty-state-title">No schedule yet</div><p>Complete setup and start the tournament to generate the Qualifier Round 1 schedule.</p></div>`;
    return;
  }

  let html = '';

  // Sub-tabs for groups
  html += '<div class="sub-tabs">';
  html += `<button class="sub-tab ${!state._activeQR1Group || state._activeQR1Group === 'all' ? 'active' : ''}" onclick="state._activeQR1Group='all';renderQR1()">All Groups</button>`;
  state.groups.forEach(g => {
    const gMatches = qr1.matches.filter(m => m.groupId === g.id);
    const completed = gMatches.filter(m => m.status === 'completed').length;
    html += `<button class="sub-tab ${state._activeQR1Group === g.id ? 'active' : ''}" onclick="state._activeQR1Group='${g.id}';renderQR1()">
      ${g.name} <span class="tab-badge">${completed}/${gMatches.length}</span>
    </button>`;
  });
  html += '</div>';

  const groupsToShow = state._activeQR1Group && state._activeQR1Group !== 'all'
    ? state.groups.filter(g => g.id === state._activeQR1Group)
    : state.groups;

  groupsToShow.forEach(g => {
    const gMatches = qr1.matches.filter(m => m.groupId === g.id);
    const completed = gMatches.filter(m => m.status === 'completed').length;
    const leader = g.leaderId ? getPlayerNameSafe(g.leaderId) : 'None';
    const standings = sortStandings(computeStandings(g.playerIds, gMatches, state.config));
    const pct = gMatches.length ? Math.round(completed / gMatches.length * 100) : 0;

    html += `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${g.name}</div>
          <div class="card-subtitle">Leader: ${leader} \u00b7 ${completed}/${gMatches.length} matches</div>
        </div>
        <div class="flex items-center gap-12">
          <span class="meta-tag">${pct}%</span>
          <div class="progress-bar" style="width:80px"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>

      <!-- Standings -->
      <div class="card-section-title">Standings</div>
      <div class="table-caption">Top <strong>${state.config.advanceTop}</strong> go to Pool A · remaining players go to Pool B</div>
      <div class="table-wrap mb-20">
        <table class="standings-table">
          <thead><tr>
            <th class="col-rank">#</th><th>Player</th><th class="col-num">W</th><th class="col-num">L</th><th class="col-num col-pf">PF</th><th class="col-num col-pa">PA</th><th class="col-num" title="Weighted points: Wins × ${state.config.winWeight || 20} + Σ win margins − Σ loss margins">WP</th>
            ${qr1.status === 'completed' ? '<th>Pool</th>' : ''}
          </tr></thead>
          <tbody>
            ${standings.map((s, i) => {
              const isTop = i < state.config.advanceTop;
              const isLeader = g.leaderId === s.playerId;
              return `<tr class="${isTop ? 'champion-row' : 'consolation-row'}">
                <td class="col-rank">${rankCell(i + 1)}</td>
                <td class="col-player">${getPlayerNameSafe(s.playerId)}${isLeader ? '<span class="leader-star" title="Group leader" aria-label="Group leader">★</span>' : ''}${tieBadge(standings, i)}</td>
                <td class="col-num">${s.wins}</td><td class="col-num">${s.losses}</td>
                <td class="col-num col-pf">${s.totalPointsScored}</td><td class="col-num col-pa">${s.totalPointsConceded}</td>
                <td class="col-num col-strong">${s.weightedPoints}</td>
                ${qr1.status === 'completed' ? `<td><span class="badge ${isTop ? 'badge-champion' : 'badge-consolation'}">${isTop ? 'Pool A' : 'Pool B'}</span></td>` : ''}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <!-- Matches -->
      <div class="card-section-title">Matches</div>
      ${gMatches.map(m => renderMatchRow(m, 'qr1')).join('')}
    </div>`;
  });

  // Advance button
  const allCompleted = qr1.matches.every(m => m.status === 'completed');
  if (qr1.status === 'in_progress') {
    html += `<div class="text-center mt-24">
      <button class="btn btn-lg btn-success" onclick="advanceToQR2()" ${!allCompleted ? 'disabled' : ''}>
        Complete QR1 & Advance to QR2
      </button>
      ${!allCompleted ? '<div class="helper-text">Complete all matches first</div>' : ''}
    </div>`;
  }

  document.getElementById('tab-qr1').innerHTML = html;
  updateBadge('qr1', qr1.matches);
}

// ═══════════════════════════════════════════════════════════════
// MATCH ROW RENDERING
// ═══════════════════════════════════════════════════════════════

function rankCell(rank) {
  if (rank <= 3) return `<span class="rank-chip r${rank}" aria-label="Rank ${rank}">${rank}</span>`;
  return String(rank);
}

function diffCell(value, negative, colClass) {
  if (!value) return `<td class="col-num col-zero ${colClass}">0</td>`;
  return `<td class="col-num ${negative ? 'col-negative' : 'col-positive'} ${colClass}">${negative ? '-' : '+'}${value}</td>`;
}

function renderMatchRow(m, round) {
  const isCompleted = m.status === 'completed';

  if (isCompleted) {
    const s1 = m.team1.score, s2 = m.team2.score;
    const t1Won = s1 > s2;
    return `<div class="match-card completed">
      <div class="match-num">#${m.matchNum}</div>
      <div class="match-teams">
        <span class="team-name ${t1Won ? 'won' : ''}">${getPlayerNamesSafe(m.team1.playerIds)}</span>
        <span class="vs-label">vs</span>
        <span class="team-name right ${!t1Won ? 'won' : ''}">${getPlayerNamesSafe(m.team2.playerIds)}</span>
      </div>
      <div class="score-display" aria-label="Final score ${s1} to ${s2}">
        <span class="${t1Won ? 'score-winner' : 'score-loser'}">${s1}</span>
        <span class="score-dash">\u2013</span>
        <span class="${!t1Won ? 'score-winner' : 'score-loser'}">${s2}</span>
      </div>
      <div class="match-meta">
        <span class="badge badge-success">Final</span>
        ${m.court ? `<span class="meta-tag">Ct ${m.court}</span>` : ''}
        ${m.birdies ? `<span class="meta-tag">${m.birdies} \uD83C\uDFF8</span>` : ''}
      </div>
      <button class="btn btn-sm btn-icon btn-ghost admin-only match-edit" onclick="editScore('${m.id}','${round}')" title="Edit score" aria-label="Edit score for match ${m.matchNum}">${ICON.pencil}</button>
    </div>`;
  }

  return `<div class="match-card pending">
    <div class="match-num">#${m.matchNum}</div>
    <div class="match-teams">
      <span class="team-name">${getPlayerNamesSafe(m.team1.playerIds)}</span>
      <span class="vs-label">vs</span>
      <span class="team-name right">${getPlayerNamesSafe(m.team2.playerIds)}</span>
    </div>
    <span class="badge badge-neutral guest-only">Scheduled</span>
    <div class="score-entry">
      <input type="number" inputmode="numeric" class="score-input" min="0" max="${state.config.deuceCap}" id="s1_${m.id}" placeholder="0" aria-label="Team 1 score" required>
      <span class="score-separator">\u2013</span>
      <input type="number" inputmode="numeric" class="score-input" min="0" max="${state.config.deuceCap}" id="s2_${m.id}" placeholder="0" aria-label="Team 2 score" required>
    </div>
    <div class="match-meta admin-only">
      <input type="text" class="meta-input" id="ct_${m.id}" value="${m.court || ''}" placeholder="Court" title="Court" aria-label="Court" required>
      <input type="number" inputmode="numeric" class="meta-input" id="bd_${m.id}" value="${m.birdies || ''}" placeholder="Birdies" min="0" max="20" title="Birdies" aria-label="Birdies used" required>
    </div>
    <button class="btn btn-sm btn-primary" onclick="submitScore('${m.id}','${round}')">Save</button>
  </div>`;
}

function submitScore(matchId, round) {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  const s1 = parseInt(document.getElementById(`s1_${matchId}`).value);
  const s2 = parseInt(document.getElementById(`s2_${matchId}`).value);

  if (!validateScore(s1, s2, state.config)) {
    toast('Invalid score. Check rules (win by 2, cap at ' + state.config.deuceCap + ')', 'error');
    return;
  }

  const ctEl = document.getElementById(`ct_${matchId}`);
  const bdEl = document.getElementById(`bd_${matchId}`);

  const matches = state.rounds[round].matches;
  const m = matches.find(m => m.id === matchId);
  if (!m) return;
  m.team1.score = s1;
  m.team2.score = s2;
  m.status = 'completed';
  m.winner = s1 > s2 ? 'team1' : 'team2';
  if (ctEl) m.court = ctEl.value.trim();
  if (bdEl && bdEl.value) m.birdies = parseInt(bdEl.value) || 0;
  touchMatch(m);
  saveState();

  if (round === 'qr1') renderQR1();
  else if (round === 'qr2') renderQR2();
  else if (round === 'semis') renderSemis();
}

function editScore(matchId, round) {
  if (!isAdmin()) return;
  const matches = state.rounds[round].matches;
  const m = matches.find(m => m.id === matchId);
  if (!m) return;
  m.status = 'scheduled';
  m.team1.score = null;
  m.team2.score = null;
  m.winner = null;
  touchMatch(m);
  saveState();

  if (round === 'qr1') renderQR1();
  else if (round === 'qr2') renderQR2();
  else if (round === 'semis') renderSemis();
}

function updateBadge(round, matches) {
  const el = document.getElementById(`${round}Badge`);
  if (!el || !matches.length) return;
  const done = matches.filter(m => m.status === 'completed').length;
  el.textContent = Math.round(done / matches.length * 100) + '%';
}

// ═══════════════════════════════════════════════════════════════
// ADVANCEMENT — QR1 → QR2
// ═══════════════════════════════════════════════════════════════

function advanceToQR2() {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  confirmModal('Advance to Qualifier Round 2?', 'Group rankings will be locked and players will be split into the Champion and Consolation pools.', {
    label: 'Advance to Round 2', variant: 'btn-primary', onConfirm: doAdvanceToQR2
  });
}

function doAdvanceToQR2() {
  const c = state.config;
  const champion = [];
  const consolation = [];
  const qr1Rankings = {};
  let globalRank = 1;

  state.groups.forEach(g => {
    const gMatches = state.rounds.qr1.matches.filter(m => m.groupId === g.id);
    const standings = sortStandings(computeStandings(g.playerIds, gMatches, c));
    standings.forEach((s, i) => {
      qr1Rankings[s.playerId] = globalRank++;
      if (i < c.advanceTop) champion.push(s.playerId);
      else consolation.push(s.playerId);
    });
  });

  state.rounds.qr1.status = 'completed';
  state._qr1Rankings = qr1Rankings;

  const champMatches = generateDoublesSchedule(champion, c.matchesPerPlayer);
  const consolMatches = generateDoublesSchedule(consolation, c.matchesPerPlayer);

  const matches = [];
  champMatches.forEach((m, i) => {
    matches.push({
      id: uid(), pool: 'champion', matchNum: i + 1, court: '',
      team1: { playerIds: m.team1, score: null },
      team2: { playerIds: m.team2, score: null },
      status: 'scheduled', winner: null
    });
  });
  consolMatches.forEach((m, i) => {
    matches.push({
      id: uid(), pool: 'consolation', matchNum: i + 1, court: '',
      team1: { playerIds: m.team1, score: null },
      team2: { playerIds: m.team2, score: null },
      status: 'scheduled', winner: null
    });
  });

  state.rounds.qr2 = { status: 'in_progress', poolStatus: { champion: 'in_progress', consolation: 'in_progress' }, pools: { champion, consolation }, matches, standings: [] };
  saveState();
  renderAll();
  switchTab('qr2');
  toast('Advanced to QR2!', 'success');
}

  }

      </div>
      <div class="flex items-center gap-12">
        <span class="meta-tag">${pct}%</span>

      </div>
    </div>

    <div class="card-section-title">Standings</div>
    <div class="table-caption">Top <strong>${state.config.semiFinalSlots}</strong> advance to the Semi-Finals · ranked by WP; ties by wins, points for, points against</div>
    <div class="table-wrap mb-20">
      <table class="standings-table">
        <thead><tr>
          <th class="col-rank">#</th><th>Player</th><th class="col-num">W</th><th class="col-num">L</th><th class="col-num col-pf">PF</th><th class="col-num col-pa">PA</th><th class="col-num" title="Weighted points: Wins × ${state.config.winWeight || 20} + Σ win margins − Σ loss margins">WP</th>
          ${poolDone ? '<th>Status</th>' : ''}
        </tr></thead>
        <tbody>
          ${standings.map((s, i) => {
            const advances = i < state.config.semiFinalSlots;
            return `<tr class="${advances ? 'highlight-row' : ''}">
              <td class="col-rank">${rankCell(i + 1)}</td>
              <td class="col-player">${getPlayerNameSafe(s.playerId)}${tieBadge(standings, i)}</td>
              <td class="col-num">${s.wins}</td><td class="col-num">${s.losses}</td>

// ═══════════════════════════════════════════════════════════════
// ADVANCEMENT — QR2 → SEMI-FINALS
// ═══════════════════════════════════════════════════════════════

function advanceToSemis(pool) {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  if (!POOLS.includes(pool)) return;
  confirmModal(`Advance ${poolLabel(pool)} Pool to Semi-Finals?`, `${poolLabel(pool)} Pool standings will be locked and its semi-final pairings seeded. The other pool is unaffected.`, {
    label: 'Advance to Semi-Finals', variant: 'btn-primary', onConfirm: () => doAdvanceToSemis(pool)
  });
}

function doAdvanceToSemis(pool) {
  const c = state.config;
  const qr2 = state.rounds.qr2;
  const semis = state.rounds.semis;
  const k = c.semiFinalSlots;

  if (qr2.poolStatus[pool] === 'completed') return;
  if (!k || k % 4 !== 0) {
    toast(`Invalid semi-final slots (${k}) — must be a multiple of 4`, 'error');
    return;
  }

  const poolMatches = qr2.matches.filter(m => m.pool === pool);
  if (!poolMatches.every(m => m.status === 'completed')) {
    toast(`Complete all ${poolLabel(pool)} Pool matches first`, 'error');
    return;
  }
  const standings = sortStandings(computeStandings(qr2.pools[pool], poolMatches, c));
  if (standings.length < k) {
    toast(`${poolLabel(pool)} pool has only ${standings.length} players — needs ${k} for Semi-Finals`, 'error');
    return;
  }

  const top = standings.slice(0, k);
  const prefix = pool === 'champion' ? 'A' : 'B';
  const matches = [];
  // Generic S-curve seeding: for k qualifiers, produce k/4 doubles matches.
  // Match i pairs seeds [i, k-1-i] vs [k/2-1-i, k/2+i] (0-indexed).
  for (let i = 0; i < k / 4; i++) {
    matches.push({
      id: uid(), pool, label: `Match ${prefix}${i + 1}`, matchNum: i + 1,
      team1: { playerIds: [top[i].playerId, top[k - 1 - i].playerId], score: null },
      team2: { playerIds: [top[k / 2 - 1 - i].playerId, top[k / 2 + i].playerId], score: null },
      status: 'scheduled', winner: null
    });
  }

  qr2.poolStatus[pool] = 'completed';
  recomputeRoundStatus(qr2);
  semis.matches = semis.matches.filter(m => m.pool !== pool).concat(matches);
  semis.poolStatus[pool] = 'in_progress';
  recomputeRoundStatus(semis);
  saveState();
  renderAll();
  switchTab('semis');
  toast(`${poolLabel(pool)} Semi-Finals set up!`, 'success');
}

// ═══════════════════════════════════════════════════════════════
// RENDERING — SEMI-FINALS TAB
// ═══════════════════════════════════════════════════════════════

function setSemisFormat(pool, format) {
  if (!isAdmin()) return;
  const semis = state.rounds.semis;
  if (!semis.poolFormats) semis.poolFormats = { champion: 'single', consolation: 'single' };
  semis.poolFormats[pool] = format;

  // Convert matches for this pool
  semis.matches.filter(m => m.pool === pool).forEach(m => {
    if (format === 'bestOf3' && !m.games) {
      // Convert single → bestOf3: preserve existing score as game 1 if completed
      if (m.status === 'completed') {
        m.games = [
          { team1Score: m.team1.score, team2Score: m.team2.score, winner: m.team1.score > m.team2.score ? 'team1' : 'team2' },
          { team1Score: null, team2Score: null, winner: null },
          { team1Score: null, team2Score: null, winner: null }
        ];
        m.team1.gamesWon = m.games[0].winner === 'team1' ? 1 : 0;
        m.team2.gamesWon = m.games[0].winner === 'team2' ? 1 : 0;
        m.status = 'in_progress';
        m.winner = null;
      } else {
        m.games = [
          { team1Score: null, team2Score: null, winner: null },
          { team1Score: null, team2Score: null, winner: null },
          { team1Score: null, team2Score: null, winner: null }
        ];
        m.team1.gamesWon = 0;
        m.team2.gamesWon = 0;
      }
    } else if (format === 'single' && m.games) {
      // Convert bestOf3 → single: use game 1 score if played
      if (m.games[0] && m.games[0].team1Score !== null) {
        m.team1.score = m.games[0].team1Score;
        m.team2.score = m.games[0].team2Score;
        m.winner = m.games[0].winner;
        m.status = 'completed';
      } else {
        m.team1.score = null;
        m.team2.score = null;
        m.winner = null;
        m.status = 'scheduled';
      }
      delete m.games;
      delete m.team1.gamesWon;
      delete m.team2.gamesWon;
    }
  });

  saveState();
  renderSemis();
}

function submitSemisGame(matchId, gameIdx) {
  if (!isAdmin()) return;
  const m = state.rounds.semis.matches.find(x => x.id === matchId);
  if (!m) return;
  const s1 = parseInt(document.getElementById('sg1_' + matchId + '_' + gameIdx).value);
  const s2 = parseInt(document.getElementById('sg2_' + matchId + '_' + gameIdx).value);

  if (!validateScore(s1, s2, state.config)) {
    toast('Invalid score', 'error');
    return;
  }

  const game = m.games[gameIdx];
  game.team1Score = s1;
  game.team2Score = s2;
  game.winner = s1 > s2 ? 'team1' : 'team2';

  m.team1.gamesWon = m.games.filter(g => g.winner === 'team1').length;
  m.team2.gamesWon = m.games.filter(g => g.winner === 'team2').length;

  if (m.team1.gamesWon >= 2) { m.winner = 'team1'; m.status = 'completed'; }
  else if (m.team2.gamesWon >= 2) { m.winner = 'team2'; m.status = 'completed'; }

  touchMatch(m);
  saveState();
  renderSemis();
  if (m.winner) toast(m.label + ' won by ' + getPlayerNamesSafe(m[m.winner].playerIds) + '!', 'success');
}

function editSemisGame(matchId, gameIdx) {
  if (!isAdmin()) return;
  const m = state.rounds.semis.matches.find(x => x.id === matchId);
  if (!m || !m.games[gameIdx]) return;
  const g = m.games[gameIdx];
  g.team1Score = null;
  g.team2Score = null;
  g.winner = null;
  m.team1.gamesWon = m.games.filter(x => x.winner === 'team1').length;
  m.team2.gamesWon = m.games.filter(x => x.winner === 'team2').length;
  m.winner = null;
  m.status = 'in_progress';
  touchMatch(m);
  saveState();
  renderSemis();
}

function teamBlockClass(mine, theirs, winner, isMe) {
  if (winner) return isMe ? 'won' : 'lost';
  if (mine > theirs) return 'leading';
  if (mine < theirs) return 'trailing';
  return '';
}

function seriesStatusBadge(winner, anyPlayed) {
  if (winner) return '<span class="badge badge-success badge-dot">Final</span>';
  if (anyPlayed) return '<span class="badge badge-warning badge-dot">In Progress</span>';
  return '<span class="badge badge-neutral">Scheduled</span>';
}

function renderSemisMatchBo3(m, isChamp) {
  const poolColor = isChamp ? 'champion' : 'consolation';
  const c = state.config;
  const g1 = m.team1.gamesWon || 0, g2 = m.team2.gamesWon || 0;
  const anyPlayed = m.games.some(g => g.team1Score !== null);
  let html = '<div class="card semi-match">';
  html += '<div class="card-section-title"><span class="pool-label ' + poolColor + '" style="margin:0">' + m.label + '</span>' + seriesStatusBadge(m.winner, anyPlayed) + '</div>';
  html += '<div class="finals-format">Best of 3 \u00b7 First to 2 games</div>';

  html += '<div class="teams-display">';
  html += '<div class="team-block ' + teamBlockClass(g1, g2, m.winner, m.winner === 'team1') + '"><div class="team-block-names">' + getPlayerNamesSafe(m.team1.playerIds) + '</div>';
  html += '<div class="team-block-score">' + g1 + '</div></div>';
  html += '<div class="vs-circle" aria-hidden="true">vs</div>';
  html += '<div class="team-block ' + teamBlockClass(g2, g1, m.winner, m.winner === 'team2') + '"><div class="team-block-names">' + getPlayerNamesSafe(m.team2.playerIds) + '</div>';
  html += '<div class="team-block-score">' + g2 + '</div></div>';
  html += '</div>';

  html += '<div class="game-scores-row bo3">';
  m.games.forEach(function(g, gi) {
    const played = g.team1Score !== null;
    const needed = gi === 0 || gi === 1 || (m.team1.gamesWon === 1 && m.team2.gamesWon === 1);
    if (!needed && !played) { html += '<div class="game-score-box pending dim" aria-label="Game ' + (gi + 1) + ' if needed"><div class="game-label">Game ' + (gi + 1) + '</div><span class="game-ifneeded">If needed</span></div>'; return; }
    html += '<div class="game-score-box ' + (played ? '' : 'pending') + '"><div class="game-label">Game ' + (gi + 1) + '</div>';
    if (played) {
      html += '<div class="game-scores-text">';
      html += '<span class="' + (g.winner === 'team1' ? 'score-winner' : 'score-loser') + '">' + g.team1Score + '</span>';
      html += '<span class="score-dash">\u2013</span>';
      html += '<span class="' + (g.winner === 'team2' ? 'score-winner' : 'score-loser') + '">' + g.team2Score + '</span>';
      html += '</div>';
      html += '<button class="btn btn-sm btn-ghost game-edit admin-only" onclick="editSemisGame(\'' + m.id + '\',' + gi + ')">' + ICON.pencil + 'Edit</button>';
    } else {
      html += '<span class="badge badge-neutral guest-only">Scheduled</span>';
      html += '<div class="score-entry">';
      html += '<input type="number" inputmode="numeric" class="score-input" min="0" max="' + c.deuceCap + '" id="sg1_' + m.id + '_' + gi + '" placeholder="0" aria-label="Team 1 score">';
      html += '<span class="score-separator">\u2013</span>';
      html += '<input type="number" inputmode="numeric" class="score-input" min="0" max="' + c.deuceCap + '" id="sg2_' + m.id + '_' + gi + '" placeholder="0" aria-label="Team 2 score">';
      html += '<button class="btn btn-sm btn-primary" onclick="submitSemisGame(\'' + m.id + '\',' + gi + ')">Save</button>';
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  if (m.winner) {
    html += '<div class="winner-banner ' + poolColor + '">';
    html += '<div class="winner-banner-label">Winner</div>';
    html += '<h3>' + ICON.trophy + '<span>' + getPlayerNamesSafe(m[m.winner].playerIds) + '</span></h3>';
    html += '<div class="winner-banner-sub">Games ' + g1 + ' \u2013 ' + g2 + '</div>';
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderSemis() {
  const semis = state.rounds.semis;
  if (semis.status === 'not_started') {
    document.getElementById('tab-semis').innerHTML = `<div class="empty-state"><div class="empty-state-icon">${ICON.zap}</div><div class="empty-state-title">Semi-Finals not set</div><p>Finish Qualifier Round 2 and advance to seed the semi-final matches.</p></div>`;
    return;
  }

  if (!semis.poolFormats) semis.poolFormats = { champion: 'single', consolation: 'single' };

  let html = '<div class="grid-2">';
  POOLS.forEach(pool => {
    const isChamp = pool === 'champion';
    const pStatus = semis.poolStatus[pool];
    html += `<div>
      <h3 class="pool-heading ${pool}">${poolLabel(pool)} Pool ${pStatus === 'completed' ? '<span class="badge badge-success">Advanced</span>' : ''}</h3>`;

    if (pStatus === 'not_started') {
      html += `<div class="card"><div class="empty-state"><div class="empty-state-icon">${ICON.clock}</div><div class="empty-state-title">Awaiting ${poolLabel(pool)} QR2</div><p>Finish the ${poolLabel(pool)} Pool in Qualifier Round 2 and advance it to seed these semi-finals.</p></div></div></div>`;
      return;
    }

    const pMatches = semis.matches.filter(m => m.pool === pool);
    const fmt = semis.poolFormats[pool];
    html += `<div class="pool-toolbar">
        <span class="card-subtitle">1st+8th vs 4th+5th \u00b7 2nd+7th vs 3rd+6th</span>
        <select class="format-select admin-only" aria-label="${poolLabel(pool)} semi-final format" onchange="setSemisFormat('${pool}',this.value)" ${pStatus === 'completed' ? 'disabled' : ''}>
          <option value="single" ${fmt === 'single' ? 'selected' : ''}>Single Game</option>
          <option value="bestOf3" ${fmt === 'bestOf3' ? 'selected' : ''}>Best of 3</option>
        </select>
      </div>
      ${pMatches.map(m => {
        if (fmt === 'bestOf3') return renderSemisMatchBo3(m, isChamp);
        return '<div class="card semi-match"><div class="card-section-title"><span class="pool-label ' + pool + '" style="margin:0">' + m.label + '</span>' + seriesStatusBadge(m.winner, false) + '</div>' + renderMatchRow(m, 'semis') + '</div>';
      }).join('')}`;

    const allCompleted = pMatches.length > 0 && pMatches.every(m => m.status === 'completed');
    if (pStatus === 'in_progress') {
      html += `<div class="text-center mt-16">
        <button class="btn btn-lg btn-success" onclick="advanceToFinals('${pool}')" ${!allCompleted ? 'disabled' : ''}>
          Complete ${poolLabel(pool)} Semis & Advance to Final
        </button>
        ${!allCompleted ? `<div class="helper-text">Complete both ${poolLabel(pool)} semi-finals first</div>` : ''}
      </div>`;
    } else {
      html += `<div class="text-center mt-16 helper-text">${poolLabel(pool)} Final is set</div>`;
    }
    html += '</div>';
  });
  html += '</div>';

  document.getElementById('tab-semis').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// ADVANCEMENT — SEMIS → FINALS
// ═══════════════════════════════════════════════════════════════

function advanceToFinals(pool) {
  if (!isAdmin()) { toast('Admin access required', 'error'); return; }
  if (!POOLS.includes(pool)) return;
  confirmModal(`Advance ${poolLabel(pool)} Pool to the Final?`, `${poolLabel(pool)} semi-final results will be locked and the ${poolLabel(pool)} Final created. The other pool is unaffected.`, {
    label: 'Advance to Final', variant: 'btn-primary', onConfirm: () => doAdvanceToFinals(pool)
  });
}

function doAdvanceToFinals(pool) {
  const semis = state.rounds.semis;
  const finals = state.rounds.finals;
  if (semis.poolStatus[pool] !== 'in_progress') return;

  const pMatches = semis.matches.filter(m => m.pool === pool);
  if (pMatches.length < 2 || !pMatches.every(m => m.status === 'completed' && m.winner)) {
    toast(`Complete both ${poolLabel(pool)} semi-finals first`, 'error');
    return;
  }
  const winners = pMatches.map(m => (m.winner === 'team1' ? m.team1 : m.team2).playerIds);

  const formatKey = pool === 'champion' ? 'championPoolFormat' : 'consolationPoolFormat';
  const format = state.config[formatKey] || 'bestOf3';
  const numGames = format === 'bestOf3' ? 3 : 1;
  const games = [];
  for (let i = 0; i < numGames; i++) games.push({ team1Score: null, team2Score: null, winner: null });

  const match = {
    id: uid(), pool, format, label: `${poolLabel(pool)} Final`,
    team1: { playerIds: winners[0], gamesWon: 0 },
    team2: { playerIds: winners[1], gamesWon: 0 },
    games,
    status: 'in_progress', winner: null
  };

  semis.poolStatus[pool] = 'completed';
  recomputeRoundStatus(semis);
  finals.matches = finals.matches.filter(m => m.pool !== pool).concat(match);
  finals.poolStatus[pool] = 'in_progress';
  recomputeRoundStatus(finals);
  saveState();
  renderAll();
  switchTab('finals');
  toast(`${poolLabel(pool)} Final set up!`, 'success');
}

function renderFinals() {
  const finals = state.rounds.finals;
  if (finals.status === 'not_started') {
    document.getElementById('tab-finals').innerHTML = `<div class="empty-state"><div class="empty-state-icon">${ICON.trophy}</div><div class="empty-state-title">Finals not set</div><p>Complete both semi-final matches in each pool to unlock the finals.</p></div>`;
    return;
  }

  let html = '<div class="grid-2">';
  POOLS.forEach(pool => {
    const fm = finals.matches.find(m => m.pool === pool);
    if (!fm) {
      const semiState = state.rounds.semis.poolStatus[pool];
      html += `<div class="finals-card ${pool}">
        <div class="pool-label">${poolLabel(pool)} Final</div>
        <div class="empty-state"><div class="empty-state-icon">${ICON.clock}</div><div class="empty-state-title">Awaiting ${poolLabel(pool)} Semi-Finals</div><p>${semiState === 'not_started' ? `The ${poolLabel(pool)} Pool has not reached the semi-finals yet.` : `Complete both ${poolLabel(pool)} semi-finals and advance to create this final.`}</p></div>
      </div>`;
      return;
    }
    const isChamp = fm.pool === 'champion';
    const poolColor = isChamp ? 'champion' : 'consolation';
    const isSingle = fm.format === 'single';
    const g1 = fm.team1.gamesWon || 0, g2 = fm.team2.gamesWon || 0;
    const anyPlayed = fm.games.some(g => g.team1Score !== null);

    html += `<div class="finals-card ${poolColor}">
      <div class="pool-label">${fm.label}</div>
      <div class="finals-format">${isSingle ? 'Single game' : 'Best of 3 \u00b7 First to 2 games'}</div>
      <div class="finals-status">${seriesStatusBadge(fm.winner, anyPlayed)}</div>

      <div class="teams-display">
        <div class="team-block ${teamBlockClass(g1, g2, fm.winner, fm.winner === 'team1')}">
          <div class="team-block-names">${getPlayerNamesSafe(fm.team1.playerIds)}</div>
          <div class="team-block-score">${isSingle && anyPlayed ? fm.games[0].team1Score : g1}</div>
        </div>
        <div class="vs-circle" aria-hidden="true">vs</div>
        <div class="team-block ${teamBlockClass(g2, g1, fm.winner, fm.winner === 'team2')}">
          <div class="team-block-names">${getPlayerNamesSafe(fm.team2.playerIds)}</div>
          <div class="team-block-score">${isSingle && anyPlayed ? fm.games[0].team2Score : g2}</div>
        </div>
      </div>

      <div class="game-scores-row ${isSingle ? 'single' : 'bo3'}">
        ${fm.games.map((g, gi) => {
          const played = g.team1Score !== null;
          const needed = isSingle ? gi === 0 : (gi === 0 || gi === 1 || (fm.team1.gamesWon === 1 && fm.team2.gamesWon === 1));
          if (!needed && !played) return isSingle ? '' : `<div class="game-score-box pending dim" aria-label="Game ${gi + 1} if needed"><div class="game-label">Game ${gi + 1}</div><span class="game-ifneeded">If needed</span></div>`;
          return `<div class="game-score-box ${played ? '' : 'pending'}">
            <div class="game-label">${isSingle ? 'Score' : 'Game ' + (gi + 1)}</div>
            ${played
              ? `<div class="game-scores-text">
                  <span class="${g.winner === 'team1' ? 'score-winner' : 'score-loser'}">${g.team1Score}</span>
                  <span class="score-dash">\u2013</span>
                  <span class="${g.winner === 'team2' ? 'score-winner' : 'score-loser'}">${g.team2Score}</span>
                </div>
                <button class="btn btn-sm btn-ghost game-edit admin-only" onclick="editFinalGame('${fm.id}',${gi})">${ICON.pencil}Edit</button>`
              : `<span class="badge badge-neutral guest-only">Scheduled</span>
                <div class="score-entry">
                  <input type="number" inputmode="numeric" class="score-input" min="0" max="${state.config.deuceCap}" id="fg1_${fm.id}_${gi}" placeholder="0" aria-label="Team 1 score">
                  <span class="score-separator">\u2013</span>
                  <input type="number" inputmode="numeric" class="score-input" min="0" max="${state.config.deuceCap}" id="fg2_${fm.id}_${gi}" placeholder="0" aria-label="Team 2 score">
                  <button class="btn btn-sm btn-primary" onclick="submitFinalGame('${fm.id}',${gi})">Save</button>
                </div>`
            }
          </div>`;
        }).join('')}
      </div>

      ${fm.winner ? `<div class="winner-banner ${poolColor}">
        <div class="winner-banner-label">${poolLabel(fm.pool)} winner</div>
        <h3>${ICON.trophy}<span>${getPlayerNamesSafe(fm[fm.winner].playerIds)}</span></h3>
        <div class="winner-banner-sub">${isSingle ? 'Score ' + fm.games[0].team1Score + ' \u2013 ' + fm.games[0].team2Score : 'Games ' + g1 + ' \u2013 ' + g2}</div>
      </div>` : ''}
    </div>`;
  });
  html += '</div>';

  document.getElementById('tab-finals').innerHTML = html;
}

function submitFinalGame(matchId, gameIdx) {
  if (!isAdmin()) return;
  const fm = state.rounds.finals.matches.find(m => m.id === matchId);
  if (!fm) return;
  const s1 = parseInt(document.getElementById(`fg1_${matchId}_${gameIdx}`).value);
  const s2 = parseInt(document.getElementById(`fg2_${matchId}_${gameIdx}`).value);

  if (!validateScore(s1, s2, state.config)) {
    toast('Invalid score', 'error');
    return;
  }

  const game = fm.games[gameIdx];
  game.team1Score = s1;
  game.team2Score = s2;
  game.winner = s1 > s2 ? 'team1' : 'team2';

  fm.team1.gamesWon = fm.games.filter(g => g.winner === 'team1').length;
  fm.team2.gamesWon = fm.games.filter(g => g.winner === 'team2').length;

  const winsNeeded = fm.format === 'single' ? 1 : 2;
  if (fm.team1.gamesWon >= winsNeeded) { fm.winner = 'team1'; fm.status = 'completed'; }
  else if (fm.team2.gamesWon >= winsNeeded) { fm.winner = 'team2'; fm.status = 'completed'; }

  state.rounds.finals.poolStatus[fm.pool] = fm.status === 'completed' ? 'completed' : 'in_progress';
  recomputeRoundStatus(state.rounds.finals);

  touchMatch(fm);
  saveState();
  renderFinals();
  renderDashboard();
  updateHeader();

  if (fm.winner) toast(`${fm.label} won by ${getPlayerNamesSafe(fm[fm.winner].playerIds)}!`, 'success');
}

function editFinalGame(matchId, gameIdx) {
  if (!isAdmin()) return;
  const fm = state.rounds.finals.matches.find(m => m.id === matchId);
  if (!fm) return;
  fm.games[gameIdx] = { team1Score: null, team2Score: null, winner: null };
  fm.team1.gamesWon = fm.games.filter(g => g.winner === 'team1').length;
  fm.team2.gamesWon = fm.games.filter(g => g.winner === 'team2').length;
  fm.winner = null;
  fm.status = 'in_progress';
  state.rounds.finals.poolStatus[fm.pool] = 'in_progress';
  recomputeRoundStatus(state.rounds.finals);
  touchMatch(fm);
  saveState();
  renderFinals();
  renderDashboard();
  updateHeader();
}

function renderDashboard() {
  const totalPlayers = state.players.length;

    ...state.rounds.qr2.matches,

  const progressPct = totalMatches ? Math.round(completedMatches / totalMatches * 100) : 0;

    if (s === 'completed') return '<span class="badge badge-success">Completed</span>';

      <div class="stat-card">
        <div class="stat-label">Matches Played</div>

      </div>
      <div class="stat-card">
        <div class="stat-label">Progress ${progressPct === 100 ? '<span class="badge badge-success">Complete</span>' : ''}</div>
        <div class="stat-value">${progressPct}<span class="stat-denom">%</span></div>
        <div class="progress-bar" role="progressbar" aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100" aria-label="Tournament progress"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      </div>
    </div>

    <!-- Tournament Progress -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Tournament Progress</div>
          <div class="card-subtitle">${completedMatches} of ${totalMatches || 0} matches recorded</div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="summary-table">
          <thead><tr><th>Round</th><th>Status</th><th class="col-num">Matches</th><th>Details</th></tr></thead>
          <tbody>
            <tr>
              <td class="col-strong">Qualifier Round 1</td>
              <td>${roundStatus(state.rounds.qr1)}</td>
              <td class="col-num">${roundCount(state.rounds.qr1)}</td>
              <td>${state.config.numGroups} groups of ${state.config.playersPerGroup}</td>
            </tr>
            <tr>
              <td class="col-strong">Qualifier Round 2</td>
              <td>${roundStatus(state.rounds.qr2)}</td>
              <td class="col-num">${roundCount(state.rounds.qr2)}</td>
              <td>Pool A + Pool B</td>
            </tr>
            <tr>
              <td class="col-strong">Semi-Finals</td>
              <td>${roundStatus(state.rounds.semis)}</td>

            <tr>

          <div class="card-title">Ranking Rules</div>

        WP = Wins \u00d7 ${state.config.winWeight || 20} + \u03a3 win margins \u2212 \u03a3 loss margins

  document.getElementById('tab-dashboard').innerHTML = html;
}

function showBracket() {
  document.getElementById('bracketBody').innerHTML = renderBracket();
  document.getElementById('bracketOverlay').classList.add('active');
}

function closeBracket() {
  document.getElementById('bracketOverlay').classList.remove('active');
}

function bkMatchBox(label, t1Names, t2Names, t1Score, t2Score, winner, format) {
  let t1Class = 'pending', t2Class = 'pending';
  if (winner === 'team1') { t1Class = 'winner'; t2Class = 'loser'; }
  else if (winner === 'team2') { t1Class = 'loser'; t2Class = 'winner'; }
  const scoreLabel = format === 'bestOf3' ? 'games' : '';
  return '<div class="bk-match">' +
    '<div class="bk-match-head">' + label + (scoreLabel ? ' \u00b7 ' + scoreLabel : '') + '</div>' +
    '<div class="bk-team ' + t1Class + '"><span class="bk-team-name">' + t1Names + '</span><span class="bk-team-score">' + (t1Score !== null && t1Score !== undefined ? t1Score : '\u2014') + '</span></div>' +
    '<div class="bk-team ' + t2Class + '"><span class="bk-team-name">' + t2Names + '</span><span class="bk-team-score">' + (t2Score !== null && t2Score !== undefined ? t2Score : '\u2014') + '</span></div>' +
  '</div>';
}

function bkConnectorSvg(h, done) {
  const mid = h / 2;
  return '<div class="bk-connector' + (done ? ' done' : '') + '" style="height:' + h + 'px">' +
    '<svg viewBox="0 0 40 ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<line x1="0" y1="' + (h * 0.25) + '" x2="20" y2="' + (h * 0.25) + '"/>' +
    '<line x1="0" y1="' + (h * 0.75) + '" x2="20" y2="' + (h * 0.75) + '"/>' +
    '<line x1="20" y1="' + (h * 0.25) + '" x2="20" y2="' + (h * 0.75) + '"/>' +
    '<line x1="20" y1="' + mid + '" x2="40" y2="' + mid + '"/>' +
    '</svg></div>';
}

function bkStraightSvg(h, done) {
  const mid = h / 2;
  return '<div class="bk-connector' + (done ? ' done' : '') + '" style="height:' + h + 'px">' +
    '<svg viewBox="0 0 40 ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<line x1="0" y1="' + mid + '" x2="40" y2="' + mid + '"/>' +
    '</svg></div>';
}

function renderBracket() {
  const c = state.config;
  const semis = state.rounds.semis;
  const finals = state.rounds.finals;
  let html = '';

  // Render per-pool bracket (Champion + Consolation)
  ['champion', 'consolation'].forEach(pool => {
    const isChamp = pool === 'champion';
    html += '<div class="bk-pool">';
    html += '<div class="bk-pool-title ' + pool + '">' + poolLabel(pool) + ' Bracket' + '</div>';

    html += '<div class="bk-scroll">';
    html += '<div class="bk-round-titles"><div class="bk-round-title">Semi-Finals</div><div class="bk-round-title">Final</div><div class="bk-round-title">Winner</div></div>';
    html += '<div class="bk-tree">';

    const pFinalForConn = finals.status !== 'not_started' ? finals.matches.find(m => m.pool === pool) : null;

    // ROUND 1: Semi-finals (2 matches)
    html += '<div class="bk-round">';
    const pSemiMatches = semis.status !== 'not_started' ? semis.matches.filter(m => m.pool === pool) : [];
    if (pSemiMatches.length >= 2) {
      pSemiMatches.forEach(m => {
        const t1N = getPlayerNamesSafe(m.team1.playerIds);
        const t2N = getPlayerNamesSafe(m.team2.playerIds);
        let t1S = null, t2S = null;
        if (m.status === 'completed') {
          if (m.games) { t1S = m.team1.gamesWon; t2S = m.team2.gamesWon; }
          else { t1S = m.team1.score; t2S = m.team2.score; }
        }
        const fmt = (semis.poolFormats && semis.poolFormats[pool]) || 'single';
        html += bkMatchBox(m.label, t1N, t2N, t1S, t2S, m.winner, fmt);
      });
    } else {
      html += '<div class="bk-awaiting">Semi-Final 1<br>Awaiting QR2</div>';
      html += '<div class="bk-awaiting">Semi-Final 2<br>Awaiting QR2</div>';
    }
    html += '</div>';

    // CONNECTOR: semis → final
    html += bkConnectorSvg(200, !!pFinalForConn);

    // ROUND 2: Final
    html += '<div class="bk-round">';
    const pFinal = finals.status !== 'not_started' ? finals.matches.find(m => m.pool === pool) : null;
    if (pFinal) {
      const t1N = getPlayerNamesSafe(pFinal.team1.playerIds);
      const t2N = getPlayerNamesSafe(pFinal.team2.playerIds);
      let t1S, t2S;
      if (pFinal.winner) {
        if (pFinal.format === 'single') { t1S = pFinal.games[0].team1Score; t2S = pFinal.games[0].team2Score; }
        else { t1S = pFinal.team1.gamesWon; t2S = pFinal.team2.gamesWon; }
      } else {
        t1S = pFinal.team1.gamesWon || null;
        t2S = pFinal.team2.gamesWon || null;
      }
      html += bkMatchBox(pFinal.label, t1N, t2N, t1S, t2S, pFinal.winner, pFinal.format || 'bestOf3');
    } else {
      html += '<div class="bk-awaiting">' + poolLabel(pool) + ' Final<br>Awaiting Semis</div>';
    }
    html += '</div>';

    // CONNECTOR: final → winner
    html += bkStraightSvg(80, !!(pFinal && pFinal.winner));

    // WINNER
    html += '<div class="bk-round">';
    if (pFinal && pFinal.winner) {
      const wNames = getPlayerNamesSafe(pFinal[pFinal.winner].playerIds);
      html += '<div class="bk-winner ' + pool + '">';
      html += '<div class="bk-winner-icon">' + ICON.trophy + '</div>';
      html += '<div class="bk-winner-name">' + wNames + '</div>';
      html += '<div class="bk-winner-sub">' + poolLabel(pool) + ' winner</div>';
      html += '</div>';
    } else {
      html += '<div class="bk-awaiting">Winner<br>TBD</div>';
    }
    html += '</div>';

    html += '</div>'; // bk-tree
    html += '</div>'; // bk-scroll
    html += '</div>'; // bk-pool
  });

  return html;

  // OLD CODE BELOW - REMOVED
  if (false) {
  let _html = '<div class="bracket-flow">';
  _html += '<div class="bracket-stage">';
  if (state.rounds.qr1.status === 'not_started') {
    state.groups.forEach(g => {
      const players = g.playerIds.map(id => getPlayerNameSafe(id));
      html += '<div class="bracket-group">';
      html += '<div class="bracket-group-title" style="color:var(--primary)">' + g.name + '</div>';
      players.forEach(p => { html += '<div class="bracket-player">' + p + '</div>'; });
      html += '</div>';
    });
  } else {
    state.groups.forEach(g => {
      const gMatches = state.rounds.qr1.matches.filter(m => m.groupId === g.id);
      const standings = sortStandings(computeStandings(g.playerIds, gMatches, c));
      html += '<div class="bracket-group">';
      html += '<div class="bracket-group-title" style="color:var(--primary)">' + g.name + '</div>';
      standings.forEach((s, i) => {
        const adv = i < c.advanceTop;
        html += '<div class="bracket-player ' + (adv ? 'advances' : 'eliminated') + '">';
        html += '<span>' + (i + 1) + '. ' + getPlayerNameSafe(s.playerId) + '</span>';
        html += '<span class="bracket-match-score">' + s.wins + 'W ' + s.losses + 'L</span>';
        html += '</div>';
      });
      html += '</div>';
    });
  }
  html += '</div>';

  // STAGE 2: QR2 Pools
  html += '<div class="bracket-stage">';
  html += '<div class="bracket-stage-title">QR2 \u2014 Pools</div>';
  const qr2 = state.rounds.qr2;
  if (qr2.status === 'not_started') {
    html += '<div class="bracket-group"><div class="bracket-group-title" style="color:var(--champion)">Pool A</div><div class="bracket-player" style="color:var(--text-muted)">Top ' + c.advanceTop + ' per group</div></div>';
    html += '<div class="bracket-group"><div class="bracket-group-title" style="color:var(--consolation)">Pool B</div><div class="bracket-player" style="color:var(--text-muted)">Remaining players</div></div>';
  } else {
    ['champion', 'consolation'].forEach(pool => {
      const isChamp = pool === 'champion';
      const poolIds = qr2.pools[pool];
      const poolMatches = qr2.matches.filter(m => m.pool === pool);
      const standings = sortStandings(computeStandings(poolIds, poolMatches, c));
      html += '<div class="bracket-group">';
      html += '<div class="bracket-group-title" style="color:var(--' + (isChamp ? 'champion' : 'consolation') + ')">' + poolLabel(pool) + '</div>';
      standings.forEach((s, i) => {
        const adv = i < c.semiFinalSlots;
        html += '<div class="bracket-player ' + (qr2.status === 'completed' ? (adv ? 'advances' : 'eliminated') : '') + '">';
        html += '<span>' + (i + 1) + '. ' + getPlayerNameSafe(s.playerId) + '</span>';
        html += '<span class="bracket-match-score">' + s.wins + 'W ' + s.losses + 'L</span>';
        html += '</div>';
      });
      html += '</div>';
    });
  }
  html += '</div>';

  // STAGE 3: Semi-Finals
  html += '<div class="bracket-stage">';
  html += '<div class="bracket-stage-title">Semi-Finals</div>';
  const semis = state.rounds.semis;
  if (semis.status === 'not_started') {
    html += '<div class="bracket-group"><div class="bracket-player" style="color:var(--text-muted)">Awaiting QR2</div></div>';
  } else {
    ['champion', 'consolation'].forEach(pool => {
      const isChamp = pool === 'champion';
      const pMatches = semis.matches.filter(m => m.pool === pool);
      html += '<div class="bracket-group">';
      html += '<div class="bracket-group-title" style="color:var(--' + (isChamp ? 'champion' : 'consolation') + ')">' + poolLabel(pool) + '</div>';
      if (!pMatches.length) html += '<div class="bracket-player" style="color:var(--text-muted)">Awaiting QR2</div>';
      pMatches.forEach(m => {
        html += '<div class="bracket-match">';
        html += '<div class="bracket-match-label">' + m.label + '</div>';
        const t1Names = getPlayerNamesSafe(m.team1.playerIds);
        const t2Names = getPlayerNamesSafe(m.team2.playerIds);
        if (m.status === 'completed') {
          const isT1 = m.winner === 'team1';
          if (m.games) {
            html += '<div class="bracket-match-team ' + (isT1 ? 'winner' : 'loser') + '"><span>' + t1Names + '</span><span class="bracket-match-score">' + m.team1.gamesWon + '</span></div>';
            html += '<div class="bracket-match-team ' + (!isT1 ? 'winner' : 'loser') + '"><span>' + t2Names + '</span><span class="bracket-match-score">' + m.team2.gamesWon + '</span></div>';
          } else {
            html += '<div class="bracket-match-team ' + (isT1 ? 'winner' : 'loser') + '"><span>' + t1Names + '</span><span class="bracket-match-score">' + m.team1.score + '</span></div>';
            html += '<div class="bracket-match-team ' + (!isT1 ? 'winner' : 'loser') + '"><span>' + t2Names + '</span><span class="bracket-match-score">' + m.team2.score + '</span></div>';
          }
        } else {
          html += '<div class="bracket-match-team"><span>' + t1Names + '</span><span class="bracket-match-score">\u2014</span></div>';
          html += '<div class="bracket-match-team"><span>' + t2Names + '</span><span class="bracket-match-score">\u2014</span></div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
  }
  html += '</div>';

  // STAGE 4: Finals
  html += '<div class="bracket-stage">';
  html += '<div class="bracket-stage-title">Finals</div>';
  const finals = state.rounds.finals;
  if (finals.status === 'not_started') {
    html += '<div class="bracket-group"><div class="bracket-player" style="color:var(--text-muted)">Awaiting Semi-Finals</div></div>';
  } else {
    finals.matches.forEach(fm => {
      const isChamp = fm.pool === 'champion';
      html += '<div class="bracket-match" style="border-color:var(--' + (isChamp ? 'champion' : 'consolation') + ')">';
      html += '<div class="bracket-match-label" style="color:var(--' + (isChamp ? 'champion' : 'consolation') + ')">' + fm.label + '</div>';
      const t1Names = getPlayerNamesSafe(fm.team1.playerIds);
      const t2Names = getPlayerNamesSafe(fm.team2.playerIds);
      const fmtLabel = fm.format === 'single' ? 'Single' : 'Bo3';
      html += '<div style="font-size:.6rem;color:var(--text-muted);margin-bottom:4px">' + fmtLabel + '</div>';

      if (fm.winner) {
        const isT1 = fm.winner === 'team1';
        if (fm.format === 'single') {
          html += '<div class="bracket-match-team ' + (isT1 ? 'winner' : 'loser') + '"><span>' + t1Names + '</span><span class="bracket-match-score">' + fm.games[0].team1Score + '</span></div>';
          html += '<div class="bracket-match-team ' + (!isT1 ? 'winner' : 'loser') + '"><span>' + t2Names + '</span><span class="bracket-match-score">' + fm.games[0].team2Score + '</span></div>';
        } else {
          html += '<div class="bracket-match-team ' + (isT1 ? 'winner' : 'loser') + '"><span>' + t1Names + '</span><span class="bracket-match-score">' + fm.team1.gamesWon + '</span></div>';
          html += '<div class="bracket-match-team ' + (!isT1 ? 'winner' : 'loser') + '"><span>' + t2Names + '</span><span class="bracket-match-score">' + fm.team2.gamesWon + '</span></div>';
        }
        html += '<div class="bracket-connector">\u25BC</div>';
        html += '<div class="bracket-winner-banner"><h4>\uD83C\uDFC6 ' + getPlayerNamesSafe(fm[fm.winner].playerIds) + '</h4></div>';
      } else {
        html += '<div class="bracket-match-team"><span>' + t1Names + '</span><span class="bracket-match-score">' + (fm.team1.gamesWon || 0) + '</span></div>';
        html += '<div class="bracket-match-team"><span>' + t2Names + '</span><span class="bracket-match-score">' + (fm.team2.gamesWon || 0) + '</span></div>';
        if (fm.games) {
          fm.games.forEach((g, gi) => {
            if (g.team1Score !== null) {
              html += '<div style="font-size:.65rem;color:var(--text-muted);padding:2px 0">G' + (gi+1) + ': ' + g.team1Score + '-' + g.team2Score + '</div>';
            }
          });
        }
      }
      html += '</div>';
    });
  }
  html += '</div>';

  html += '</div>';
  return html;
} // end if(false) dead code block
} // end renderBracket()

// ═══════════════════════════════════════════════════════════════
// TAB NAVIGATION (ARIA-compliant)
// ═══════════════════════════════════════════════════════════════

const VALID_PAGES = ['setup', 'qr1', 'qr2', 'semis', 'finals', 'dashboard'];
_routingReady = true;

function switchTab(tabId) {
  if (VALID_PAGES.includes(tabId)) {
    window.location.hash = tabId;
  }
}

function applyRoute() {
  const hash = window.location.hash.replace('#', '');
  let tabId = VALID_PAGES.includes(hash) ? hash : 'setup';
  if (tabId === 'setup' && currentRole === 'guest') tabId = 'qr1';
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabId;
    t.setAttribute('aria-selected', isActive);
    t.setAttribute('tabindex', isActive ? '0' : '-1');
    if (isActive && t.scrollIntoView) t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.toggle('active', tc.id === `tab-${tabId}`));
}

window.addEventListener('hashchange', applyRoute);

document.getElementById('mainTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchTab(tab.dataset.tab);
});

// Keyboard navigation for tabs
document.getElementById('mainTabs').addEventListener('keydown', (e) => {
  const tabs = [...document.querySelectorAll('.tab')].filter(t => t.offsetParent !== null);
  const current = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
  let next = -1;

  if (e.key === 'ArrowRight') next = (current + 1) % tabs.length;
  else if (e.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabs.length - 1;

  if (next >= 0) {
    e.preventDefault();
    tabs[next].focus();
    switchTab(tabs[next].dataset.tab);
  }
});

function updateHeader() {
  document.getElementById('headerTitle').textContent = state.config.tournamentName || 'Badminton Tournament Manager';
  const statusEl = document.getElementById('headerStatus');
  if (state.rounds.finals.status === 'completed') { statusEl.textContent = 'Completed'; statusEl.className = 'badge badge-success'; }
  else if (state.rounds.finals.status === 'in_progress') { statusEl.textContent = 'Finals'; statusEl.className = 'badge badge-champion'; }
  else if (state.rounds.semis.status === 'in_progress') { statusEl.textContent = 'Semi-Finals'; statusEl.className = 'badge badge-warning'; }
  else if (state.rounds.qr2.status === 'in_progress') { statusEl.textContent = 'Qualifier R2'; statusEl.className = 'badge badge-primary'; }
  else if (state.rounds.qr1.status === 'in_progress') { statusEl.textContent = 'Qualifier R1'; statusEl.className = 'badge badge-primary'; }
  else { statusEl.textContent = 'Setup'; statusEl.className = 'badge badge-primary'; }
}
